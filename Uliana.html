<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 — Uliana's Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
        }

        /* Package styling */
        .pkg-1 { background-color: #dcfce7; color: #14532d; border: 1px solid #86efac; }
        .pkg-2 { background-color: #f3e8ff; color: #581c87; border: 1px solid #d8b4fe; }
        .pkg-3 { background-color: #ffedd5; color: #7c2d12; border: 1px solid #fdba74; }
        .pkg-4 { background-color: #ccfbf1; color: #134e4a; border: 1px solid #5eead4; }
        .pkg-5 { background-color: #ffe4e6; color: #881337; border: 1px solid #fecdd3; }
        .pkg-6 { background-color: #e0e7ff; color: #3730a3; border: 1px solid #a5b4fc; }
        .pkg-7 { background-color: #fef3c7; color: #78350f; border: 1px solid #fde68a; } /* Новый пакет сентябрь */

        /* Uliana's Lesson Indicator (Wed / Fri) */
        .has-lesson {
            outline: 2px solid #2563eb;
            outline-offset: -2px;
            font-weight: 800 !important;
            position: relative;
        }

        .has-lesson::after {
            content: '';
            position: absolute;
            top: 3px;
            right: 3px;
            width: 5px;
            height: 5px;
            background-color: #2563eb;
            border-radius: 50%;
        }

        .weekend-day {
            background-color: #fff1f2;
            color: #e11d48;
        }
    </style>
</head>
<body class="py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Minimal Concise Centered Header -->
        <header class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm flex flex-col items-center justify-center text-center gap-2">
            <span class="px-3.5 py-1 rounded-lg bg-indigo-600 text-white font-extrabold text-sm tracking-wide">2026</span>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">Uliana's Calendar</h1>
        </header>

        <!-- Hover Info Bar -->
        <div id="info-bar" class="hidden transition-all duration-200 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-md flex items-center justify-between text-sm">
            <span id="info-date" class="font-bold text-indigo-300"></span>
            <span id="info-status" class="bg-slate-800 px-3 py-1 rounded-lg text-xs font-semibold text-slate-200"></span>
        </div>

        <main>
            <div id="calendar-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
        </main>

        <footer class="text-center py-4 text-xs font-medium text-slate-400">
            © 2026 Uliana's Calendar
        </footer>
    </div>

    <script>
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const dayNames = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
        const year = 2026;

        const packages = [
            { id: 1, name: "Пакет 1", period: "14 янв – 10 фев", colorClass: "pkg-1", days: [
                "2026-01-14","2026-01-15","2026-01-16",
                "2026-01-19","2026-01-20","2026-01-21","2026-01-22","2026-01-23",
                "2026-01-26","2026-01-27","2026-01-28","2026-01-29","2026-01-30",
                "2026-02-02","2026-02-03","2026-02-04","2026-02-05","2026-02-06",
                "2026-02-09","2026-02-10"
            ]},
            { id: 2, name: "Пакет 2", period: "11 фев – 10 мар", colorClass: "pkg-2", days: [
                "2026-02-11","2026-02-12","2026-02-13",
                "2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20",
                "2026-02-23","2026-02-24","2026-02-25","2026-02-26","2026-02-27",
                "2026-03-02","2026-03-03","2026-03-04","2026-03-05","2026-03-06",
                "2026-03-09","2026-03-10"
            ]},
            { id: 3, name: "Пакет 3", period: "11 мар – 07 апр", colorClass: "pkg-3", days: [
                "2026-03-11","2026-03-12","2026-03-13",
                "2026-03-16","2026-03-17","2026-03-18","2026-03-19","2026-03-20",
                "2026-03-23","2026-03-24","2026-03-25","2026-03-26","2026-03-27",
                "2026-03-30","2026-03-31","2026-04-01","2026-04-02","2026-04-03",
                "2026-04-06","2026-04-07"
            ]},
            { id: 4, name: "Пакет 4", period: "08 апр – 06 май", colorClass: "pkg-4", days: [
                "2026-04-08","2026-04-09","2026-04-10",
                "2026-04-13","2026-04-14","2026-04-15","2026-04-16","2026-04-17",
                "2026-04-20","2026-04-21","2026-04-22","2026-04-23","2026-04-24",
                "2026-04-27","2026-04-28","2026-04-29","2026-04-30",
                "2026-05-04","2026-05-05","2026-05-06"
            ]},
            { id: 5, name: "Пакет 5", period: "08 май – 03 июн", colorClass: "pkg-5", days: [
                "2026-05-08",
                "2026-05-11","2026-05-12","2026-05-13","2026-05-14","2026-05-15",
                "2026-05-18","2026-05-19","2026-05-20","2026-05-21","2026-05-22",
                "2026-05-25","2026-05-26","2026-05-27","2026-05-28","2026-05-29",
                "2026-06-01","2026-06-02","2026-06-03"
            ]},
            { id: 6, name: "Пакет 6", period: "05 июн – 03 июл", colorClass: "pkg-6", days: [
                "2026-06-05",
                "2026-06-08","2026-06-09","2026-06-10","2026-06-11","2026-06-12",
                "2026-06-15","2026-06-16","2026-06-17","2026-06-18","2026-06-19",
                "2026-06-22","2026-06-23","2026-06-24","2026-06-25","2026-06-26",
                "2026-06-29","2026-06-30","2026-07-01","2026-07-02","2026-07-03"
            ]},
            { id: 7, name: "Пакет 7 (Сентябрь)", period: "02 сен – 29 сен (8 занятий)", colorClass: "pkg-7", days: [
                "2026-09-02","2026-09-03","2026-09-04",
                "2026-09-07","2026-09-08","2026-09-09","2026-09-10","2026-09-11",
                "2026-09-14","2026-09-15","2026-09-16","2026-09-17","2026-09-18",
                "2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25",
                "2026-09-28","2026-09-29"
            ]}
        ];

        // Uliana's Lessons (Wednesdays & Fridays)
        const lessons = [
            // Пакет 1
            "2026-01-14","2026-01-16","2026-01-21","2026-01-23","2026-01-28","2026-01-30","2026-02-04","2026-02-06",
            // Пакет 2
            "2026-02-11","2026-02-13","2026-02-18","2026-02-20","2026-02-25","2026-02-27","2026-03-04","2026-03-06",
            // Пакет 3
            "2026-03-11","2026-03-13","2026-03-18","2026-03-20","2026-03-25","2026-03-27","2026-04-01","2026-04-03",
            // Пакет 4
            "2026-04-08","2026-04-10","2026-04-15","2026-04-17","2026-04-22","2026-04-24","2026-04-29","2026-05-06",
            // Пакет 5
            "2026-05-08","2026-05-13","2026-05-15","2026-05-20","2026-05-22","2026-05-27","2026-05-29","2026-06-03",
            // Пакет 6
            "2026-06-05","2026-06-10","2026-06-17","2026-06-19","2026-06-24","2026-06-26","2026-07-01","2026-07-03",
            // Пакет 7 (Сентябрь: Среды и Пятницы)
            "2026-09-02","2026-09-04","2026-09-09","2026-09-11","2026-09-16","2026-09-18","2026-09-23","2026-09-25"
        ];

        function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getFirstDayOfMonth(y, m) { const d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; }
        function formatDate(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }

        function getPackageInfo(dateStr) {
            for (let pkg of packages) {
                if (pkg.days.includes(dateStr)) return pkg;
            }
            return null;
        }

        function isLesson(dateStr) { return lessons.includes(dateStr); }

        function createMonthCard(y, m) {
            const dim = getDaysInMonth(y, m);
            const off = getFirstDayOfMonth(y, m);
            const total = Math.ceil((off + dim) / 7) * 7;

            let html = `
            <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm transition-all duration-200 hover:shadow-md">
                <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                    <h3 class="font-bold text-slate-800">${monthNames[m]}</h3>
                    <span class="text-xs font-semibold px-2 py-0.5 bg-slate-100 text-slate-400 rounded-md">${y}</span>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center mb-1">
            `;

            dayNames.forEach((wd, idx) => {
                const isWk = idx >= 5;
                html += `<div class="text-xs font-bold ${isWk ? 'text-rose-500' : 'text-slate-400'} py-1">${wd}</div>`;
            });

            html += `</div><div class="grid grid-cols-7 gap-1 text-center">`;

            let day = 1;
            for (let i = 0; i < total; i++) {
                if (i >= off && day <= dim) {
                    const dateStr = formatDate(y, m, day);
                    const pkg = getPackageInfo(dateStr);
                    const hasLes = isLesson(dateStr);
                    const dateObj = new Date(y, m, day);
                    const isWk = dateObj.getDay() === 0 || dateObj.getDay() === 6;

                    let classes = "h-8 rounded-lg flex items-center justify-center text-xs font-semibold transition-all duration-150 cursor-pointer hover:scale-105 ";
                    
                    if (pkg) {
                        classes += `${pkg.colorClass} `;
                    } else if (isWk) {
                        classes += "weekend-day ";
                    } else {
                        classes += "text-slate-600 hover:bg-slate-100 ";
                    }

                    if (hasLes) {
                        classes += "has-lesson ";
                    }

                    let statusText = [];
                    if (pkg) statusText.push(`${pkg.name}`);
                    if (hasLes) statusText.push("Занятие Ульяны (Ср / Пт)");
                    if (isWk && !pkg) statusText.push("Выходной");
                    if (statusText.length === 0) statusText.push("Свободный день");

                    const fullStatus = statusText.join(" • ");
                    const readableDate = `${day} ${monthNames[m]} ${y}`;

                    html += `
                        <div class="${classes}" 
                             onmouseenter="showInfo('${readableDate}', '${fullStatus}')"
                             onmouseleave="hideInfo()">
                            ${day}
                        </div>
                    `;
                    day++;
                } else {
                    html += `<div class="h-8"></div>`;
                }
            }

            html += `</div></div>`;
            return html;
        }

        function showInfo(date, status) {
            const bar = document.getElementById("info-bar");
            document.getElementById("info-date").textContent = date;
            document.getElementById("info-status").textContent = status;
            bar.classList.remove("hidden");
        }

        function hideInfo() {
            const bar = document.getElementById("info-bar");
            bar.classList.add("hidden");
        }

        function render() {
            const container = document.getElementById("calendar-container");
            container.innerHTML = "";
            for (let m = 0; m < 12; m++) {
                container.innerHTML += createMonthCard(year, m);
            }
        }

        render();
    </script>
</body>
</html>
